<footer class="site-footer h-card">
  <data class="u-url" href="{{ "/" | relative_url }}"></data>

  <div class="wrapper">

    <!-- <h2 class="footer-heading">{{ site.title | escape }}</h2> -->

    <div class="footer-col-wrapper">
      <div class="footer-col footer-col-1">
        <ul class="contact-list">
          <li class="p-name">
            {%- if site.author -%}
              <a href="{{ "/" | relative_url }}" style="color: inherit; text-decoration: none;">{{ site.author | escape }}</a>
            {%- else -%}
              <a href="{{ "/" | relative_url }}" style="color: inherit; text-decoration: none;">{{ site.title | escape }}</a>
            {%- endif -%}
          </li>
          {%- if site.email -%}
          <li><a class="u-email" href="mailto:{{ site.email }}">{{ site.email }}</a></li>
          {%- endif -%}
        </ul>
      </div>

      <div class="footer-col footer-col-2">
        {%- include social.html -%}
      </div>

      <div class="footer-col footer-col-3">
        <p style="text-align: right">{{- site.description | escape -}}</p>
      </div>
    </div>

  </div>

</footer>
